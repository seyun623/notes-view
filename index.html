<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>JobHub</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--ink2:#4b5160;--mute:#8a90a0;--line:#e7e9ee;--brand:#2f5cff;--b50:#eef2ff;--hot:#ff4d4f}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--ink:#eceef3;--ink2:#b7bcc8;--mute:#7d8394;--line:#262a34;--brand:#6e8bff;--b50:#1c2440}}
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);z-index:5}
.top{display:flex;align-items:center;gap:10px;height:56px}.logo{font-weight:800;font-size:18px;display:flex;gap:8px;align-items:center}
.mark{width:26px;height:26px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:15px}
.upd{margin-left:auto;color:var(--mute);font-size:12px}
.lock{max-width:360px;margin:18vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:12px}
input,select,button{font:inherit}
.lock input[type=password],.q{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:100%}
.btn{border:0;background:var(--brand);color:#fff;font-weight:700;border-radius:12px;padding:12px;cursor:pointer}
.err{color:var(--hot);font-size:14px;min-height:1em}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:14px 0 6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.chip{flex:none;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-weight:600;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink2)}
.meta-line{color:var(--ink2);font-size:13px;padding:6px 2px}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px}
.body{flex:1;min-width:0}.co{font-size:13px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grp{font-size:11px;font-weight:700;color:var(--brand);background:var(--b50);padding:1px 7px;border-radius:6px}
.new{font-size:10px;font-weight:800;color:#fff;background:var(--hot);padding:1px 5px;border-radius:5px}
.ttl{display:block;margin:3px 0 4px;font-weight:700;font-size:16px;color:inherit;text-decoration:none}
.ttl:hover{text-decoration:underline}
.m{font-size:13px;color:var(--mute)}.sum{font-size:13px;color:var(--ink2);margin-top:6px;white-space:pre-line}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:58px}
.dd{font-weight:700;font-size:13px}.dd.hot{color:var(--hot)}.src{font-size:11px;color:var(--mute);text-align:right}
.srcs{font-size:12px;color:var(--mute);margin-top:6px}.srcs a{color:var(--ink2)}
.star{border:0;background:none;font-size:22px;color:var(--line);cursor:pointer;padding:0}.star.on{color:#ffb800}
.sc{font-size:11px;font-weight:700;color:var(--brand);background:var(--b50);border-radius:99px;padding:0 7px}
.empty{text-align:center;color:var(--mute);padding:50px 0}
</style>
</head>
<body>
<header><div class="wrap top"><div class="logo"><span class="mark">J</span>JobHub</div><span class="upd" id="upd"></span></div></header>

<div id="lockbox" class="lock">
  <b>잠겨 있는 공고 모음입니다</b>
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
  <label style="font-size:13px;color:var(--ink2)"><input id="remember" type="checkbox"> 이 기기에서 기억하기</label>
  <button class="btn" id="open">열기</button>
  <div class="err" id="err"></div>
</div>

<main class="wrap" id="app" hidden>
  <div class="bar">
    <input class="q" id="q" placeholder="회사·직무·키워드 검색 (예: ISMS 개인정보)">
  </div>
  <div class="chips" id="cats"></div>
  <div class="bar">
    <select id="career"><option value="">경력 전체</option><option value="0-0">신입</option><option value="1-3">1~3년</option><option value="4-7">4~7년</option><option value="8-12">8~12년</option><option value="13-99">13년+</option></select>
    <select id="group"><option value="">그룹사 전체</option></select>
    <select id="source"><option value="">출처 전체</option></select>
    <select id="dl"><option value="">마감 전체</option><option value="7">7일 내 마감</option><option value="14">2주 내 마감</option></select>
    <select id="sort"><option value="rel">추천순</option><option value="new">최신순</option><option value="dl">마감임박순</option></select>
    <label class="chip"><input type="checkbox" id="onlyStar" style="margin:0 4px 0 0">★만</label>
  </div>
  <div class="meta-line" id="count"></div>
  <div id="list"></div>
</main>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const ENC = JSON.parse($("#enc").textContent);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };

  async function decrypt(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(ENC.salt), iterations: ENC.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(ENC.iv) }, key, b64(ENC.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  let DATA = null, cat = "";
  const stars = new Set(JSON.parse(store.get("jobhub_stars") || "[]"));

  async function unlock(pw, remember) {
    try {
      DATA = await decrypt(pw);
    } catch { $("#err").textContent = "비밀번호가 맞지 않아요."; store.del("jobhub_pw"); return; }
    if (remember) store.set("jobhub_pw", pw);
    $("#lockbox").hidden = true; $("#app").hidden = false;
    $("#upd").textContent = "업데이트 " + DATA.updated;
    const cats = {}; const groups = {}; const srcs = {};
    DATA.jobs.forEach((j) => {
      j.sources = (j.sources && j.sources.length) ? j.sources : [{ label: j.source_label, url: j.url }];
      j.srcLabels = j.sources.map((x) => x.label);
      cats[j.category] = (cats[j.category] || 0) + 1;
      if (j.group_name) groups[j.group_name] = (groups[j.group_name] || 0) + 1;
      j.srcLabels.forEach((l) => { srcs[l] = (srcs[l] || 0) + 1; });
    });
    $("#cats").innerHTML = `<span class="chip on" data-c="">전체 ${DATA.jobs.length}</span>` +
      Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([c, n]) => `<span class="chip" data-c="${esc(c)}">${esc(c)} ${n}</span>`).join("");
    $("#source").innerHTML += Object.entries(srcs).sort((a, b) => b[1] - a[1]).map(([g, n]) => `<option value="${esc(g)}">${esc(g)} (${n})</option>`).join("");
    $("#group").innerHTML += Object.entries(groups).sort((a, b) => b[1] - a[1]).map(([g, n]) => `<option value="${esc(g)}">${esc(g)} (${n})</option>`).join("");
    render();
  }

  function dday(j) {
    if (!j.deadline) return null;
    const d = new Date(j.deadline + "T23:59:59+09:00"), now = new Date();
    return Math.floor((d - now) / 86400000);
  }

  function render() {
    const q = $("#q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const [lo, hi] = ($("#career").value || "-").split("-").map(Number);
    const grp = $("#group").value, src = $("#source").value, dl = Number($("#dl").value || 0), only = $("#onlyStar").checked;
    let rows = DATA.jobs.filter((j) => {
      if (cat && j.category !== cat) return false;
      if (grp && j.group_name !== grp) return false;
      if (src && !j.srcLabels.includes(src)) return false;
      if (only && !stars.has(j.id)) return false;
      if ($("#career").value && j.career_min != null && !(j.career_min <= hi && (j.career_max ?? 99) >= lo)) return false;
      const d = dday(j); if (dl && !(d != null && d >= 0 && d <= dl)) return false;
      const text = [j.title, j.company, j.category, (j.tags || []).join(" "), j.summary].join(" ").toLowerCase();
      return q.every((t) => text.includes(t));
    });
    const s = $("#sort").value;
    rows.sort((a, b) => s === "new" ? (b.first_seen || "").localeCompare(a.first_seen || "")
      : s === "dl" ? ((dday(a) ?? 999) - (dday(b) ?? 999)) : (b.relevance - a.relevance));
    $("#count").textContent = `공고 ${rows.length}개`;
    const twoDays = Date.now() - 2 * 86400000;
    $("#list").innerHTML = rows.slice(0, 400).map((j) => {
      const d = dday(j), isNew = j.first_seen && new Date(j.first_seen.replace(" ", "T") + "+09:00") > twoDays;
      const ddTxt = d == null ? "상시" : d < 0 ? "마감" : d === 0 ? "오늘마감" : "D-" + d;
      return `<div class="card"><div class="body">
        <div class="co">${esc(j.company || "")}${j.group_name ? `<span class="grp">${esc(j.group_name)}</span>` : ""}${isNew ? '<span class="new">NEW</span>' : ""}</div>
        <a class="ttl" href="${esc(j.url)}" target="_blank" rel="noopener noreferrer">${esc(j.title)}</a>
        <div class="m">${[j.career_text, j.location, j.category].filter(Boolean).map(esc).join(" · ")}</div>
        ${j.summary ? `<div class="sum">${esc(j.summary)}</div>` : ""}
        ${j.sources.length > 1 ? `<div class="srcs">같은 공고: ${j.sources.map((x) => x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.label)}</a>` : esc(x.label)).join(" · ")}</div>` : ""}
      </div><div class="side"><span class="dd ${d != null && d <= 3 && d >= 0 ? "hot" : ""}">${ddTxt}</span>
        <button class="star ${stars.has(j.id) ? "on" : ""}" data-id="${esc(j.id)}" aria-label="북마크">★</button>
        <span class="src">${esc(j.sources[0].label)}${j.sources.length > 1 ? " 외 " + (j.sources.length - 1) : ""}</span><span class="sc">${j.relevance}</span></div></div>`;
    }).join("") || '<div class="empty">조건에 맞는 공고가 없어요.</div>';
  }

  document.addEventListener("click", (e) => {
    const c = e.target.closest(".chip[data-c]");
    if (c) { document.querySelectorAll(".chip[data-c]").forEach((x) => x.classList.remove("on")); c.classList.add("on"); cat = c.dataset.c; render(); }
    const st = e.target.closest(".star");
    if (st) { const id = st.dataset.id; stars.has(id) ? stars.delete(id) : stars.add(id); store.set("jobhub_stars", JSON.stringify([...stars])); st.classList.toggle("on"); }
  });
  ["q", "career", "group", "source", "dl", "sort", "onlyStar"].forEach((id) => $("#" + id).addEventListener(id === "q" ? "input" : "change", () => DATA && render()));
  $("#open").addEventListener("click", () => unlock($("#pw").value, $("#remember").checked));
  $("#pw").addEventListener("keydown", (e) => { if (e.key === "Enter") unlock($("#pw").value, $("#remember").checked); });
  const saved = store.get("jobhub_pw"); if (saved) unlock(saved, true);
})();
</script>
</body>
</html>
