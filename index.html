<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>JobHub</title>
<style>
:root{color-scheme:light;--bg:#f6f7fa;--card:#fff;--ink:#18202c;--ink2:#526075;--line:#dce2eb;--brand:#3157d5;--b50:#edf1ff;--hot:#b32636}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#11151d;--card:#1a202b;--ink:#edf0f7;--ink2:#bbc5d6;--line:#3c4658;--brand:#a6bbff;--b50:#283555;--hot:#ffabb2}}
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.55}button,input,select{font:inherit}button,summary{cursor:pointer}button,a,input,select,summary{-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--brand);outline-offset:3px}a{color:var(--brand)}.wrap{max-width:1120px;margin:auto;padding:0 24px}
header{background:var(--card);border-bottom:1px solid var(--line)}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px}.logo{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:750}.mark{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#3157d5;color:#fff;font-size:18px}.upd{color:var(--ink2);font-size:12px;text-align:right}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.search{padding:22px 0 14px}.q,.lock input[type=password]{width:100%;padding:14px 16px;min-height:50px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}input::placeholder{color:var(--ink2)}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.chip{min-height:44px;border:1px solid var(--line);border-radius:24px;padding:8px 14px;background:var(--card);color:var(--ink2);font-size:14px}.chip.on{background:var(--ink);border-color:var(--ink);color:var(--card)}.chip .n{margin-left:6px;font-variant-numeric:tabular-nums}
.toolbar{display:flex;align-items:flex-end;flex-wrap:wrap;gap:10px}.field{display:flex;flex-direction:column;gap:4px;color:var(--ink2);font-size:12px}.field select{min-height:44px;width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--card);color:var(--ink);font-size:14px}.toolbar .field{min-width:140px}.mobile-category{display:none}#filters{margin:10px 0 0}#filterLabel{width:fit-content;min-height:44px;padding:10px 2px;font-size:14px;color:var(--ink2)}.filter-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}.filter-note{font-size:12px;color:var(--ink2);margin:6px 0 0}.filter-grid .filter-note{grid-column:1/-1}
.results{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin:8px 0 12px}.quick{display:flex;gap:4px}.quick .chip{border:0;border-radius:8px;background:none;padding:8px 12px}.quick .chip.on{background:var(--b50);color:var(--brand)}.meta-line{font-size:13px;color:var(--ink2);margin:0}.filter-state{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}.filter-state p{flex:1;min-width:160px}.text-button{border:0;background:none;color:var(--brand);min-height:44px;padding:8px;font-size:13px}
.card{display:flex;gap:20px;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px}.body{flex:1;min-width:0}.co{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--ink2)}.new{color:var(--brand);background:var(--b50);font-size:12px;padding:1px 6px;border-radius:4px}.ttl{display:block;color:var(--ink);font-size:18px;font-weight:700;text-decoration:none;line-height:1.5;margin:4px 0 6px;overflow-wrap:anywhere}.ttl:hover{text-decoration:underline}.m,.sum{font-size:14px;color:var(--ink2)}.sum{margin:8px 0 0;overflow-wrap:anywhere;white-space:pre-line}.side{flex:0 0 100px;display:flex;align-items:flex-end;flex-direction:column;gap:8px}.dd{font-size:13px;text-align:right;font-weight:600;overflow-wrap:anywhere}.dd.hot{color:var(--hot)}.star{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink2);font-size:24px}.star.on{color:var(--brand);background:var(--b50);border-color:var(--brand)}.srcs{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;margin-top:12px;color:var(--ink2)}.srcs a{color:var(--ink2);text-underline-offset:3px;min-height:24px;padding:2px 0}.job-details summary{width:fit-content;color:var(--brand);font-size:13px;min-height:44px;padding:10px 0}.job-details .sum{margin-top:0}
.empty{text-align:center;padding:40px 16px;color:var(--ink2);border:1px dashed var(--line);border-radius:16px}.btn{border:0;border-radius:10px;background:#3157d5;color:white;padding:12px 18px;min-height:44px;font-weight:600}#more{display:block;margin:24px auto;min-width:180px}#health{margin:32px 0;border-top:1px solid var(--line);padding-bottom:24px}#health summary{padding:12px 0;min-height:44px;font-size:13px;color:var(--ink2)}.health-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.lock{max-width:380px;margin:14vh auto;padding:28px;border:1px solid var(--line);border-radius:16px;background:var(--card);display:flex;flex-direction:column;gap:14px}.err{font-size:14px;color:var(--hot);min-height:1.5em}#notice{font-size:13px;color:var(--hot);padding:8px 0}
@media(max-width:600px){.wrap{padding:0 16px}.top{min-height:60px}.logo{font-size:20px}.upd{font-size:11px;max-width:155px}.search{padding-top:18px}.chips{display:none}.mobile-category{display:flex;margin-bottom:12px}.toolbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:end}.toolbar .field{min-width:0}.toolbar .field:last-child{grid-column:1/-1}.filter-grid{grid-template-columns:1fr}.card{padding:16px;gap:12px}.side{flex-basis:74px}.ttl{font-size:16px}.m,.sum{font-size:13px}.quick .chip{padding:8px 10px}.results{gap:4px}.results .meta-line{width:100%}.lock{margin:10vh 16px}.field select{font-size:16px}.q{font-size:16px}}
</style>
</head>
<body>
<header><div class="wrap top"><div class="logo"><span class="mark">J</span>JobHub</div><span class="upd" id="upd"></span></div></header>

<div id="lockbox" class="lock">
  <b>잠겨 있는 공고 모음입니다</b>
  <input id="pw" aria-label="비밀번호" type="password" placeholder="비밀번호" autocomplete="current-password">
  <label style="font-size:13px;color:var(--ink2)"><input id="remember" type="checkbox"> 이 브라우저에서 기억하기</label>
  <button class="btn" id="open">열기</button>
  <div class="err" id="err" role="alert"></div>
</div>

<main class="wrap" id="app" hidden>
  <h1 class="sr-only">관심 채용공고</h1>
  <div class="search"><input class="q" id="q" aria-label="회사·직무·키워드 검색" placeholder="회사·직무·키워드 검색"></div>
  <div class="chips" id="cats" role="group" aria-label="직무 선택, 건수는 전체 수집 공고 기준" title="직무별 건수는 검색·필터 적용 전 전체 공고 기준입니다"></div>
  <label class="field mobile-category">직무<select id="category"><option value="">직무 전체</option></select></label>
  <div class="toolbar">
    <label class="field">경력<select id="career"><option value="">경력 전체</option><option value="0-0">신입</option><option value="1-3">1~3년</option><option value="4-7">4~7년</option><option value="8-12">8~12년</option><option value="13-99">13년 이상</option></select></label>
    <label class="field">마감<select id="dl"><option value="">마감 전체</option><option value="7">7일 내 마감</option><option value="14">2주 내 마감</option></select></label>
    <label class="field">정렬<select id="sort"><option value="rel">직무 적합도순</option><option value="new">최신 수집순</option><option value="dl">마감임박순</option></select></label>
  </div>
  <p id="careerHint" class="filter-note" hidden>경력 미확인 공고도 포함됩니다. 지원 조건은 원문에서 확인하세요.</p>
  <details id="filters"><summary id="filterLabel">추가 필터</summary><div class="filter-grid">
    <label class="field">그룹사<select id="group"><option value="">그룹사 전체</option></select></label>
    <label class="field">출처<select id="source"><option value="">출처 전체</option></select></label>
    <label class="field">직무 적합도<select id="score"><option value="">점수 전체</option><option value="80">80점 이상</option></select></label>
    <p class="filter-note">적합도는 관심 직무와의 일치 정도를 나타내는 참고값이며, 합격 가능성이 아닙니다.</p>
  </div></details>
  <div class="filter-state" id="filterState" hidden><p class="meta-line" id="applied"></p><button class="text-button" id="reset">조건 초기화</button></div>
  <div class="results"><nav class="quick" id="quick" aria-label="공고 보기"><button class="chip on" data-view="all" aria-pressed="true">전체 공고</button><button class="chip" data-view="new" aria-pressed="false">새 공고</button><button class="chip" data-view="saved" aria-pressed="false">저장한 공고</button></nav><div class="meta-line" id="count" aria-live="polite" tabindex="-1"></div></div>
  <details id="savedTools" hidden><summary>저장 목록 관리</summary><p class="filter-note">이 브라우저에만 저장됩니다. 백업 파일에는 공고 식별자와 지원 상태가 포함됩니다. 복원은 기존 목록에 추가합니다.</p><button class="chip" id="backup">백업 다운로드</button><label class="chip" for="restore">백업 가져오기</label><input id="restore" type="file" accept="application/json,.json"><p class="filter-note">마감된 공고도 저장 목록에서 확인할 수 있습니다.</p></details>
  <p id="notice" role="status" hidden></p>
  <div id="list"></div><button id="more" class="btn" hidden>공고 더 보기</button>
  <details id="health"><summary>사이트별 수집 현황</summary><p class="m">각 사이트의 마지막 실행 기록입니다. 0건은 공고가 없다는 뜻으로 단정할 수 없습니다.</p><div id="healthRows"></div></details>
</main>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const ENC = JSON.parse($("#enc").textContent);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } }, del(k) { try { localStorage.removeItem(k); } catch {} } };

  function notice(message) { $("#notice").textContent = message; $("#notice").hidden = !message; }
  let storageWarning = "";

  async function decrypt(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(ENC.salt), iterations: ENC.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(ENC.iv) }, key, b64(ENC.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  let DATA = null, view = "all", visible = 40;
  let savedStars = []; try { const value = JSON.parse(store.get("jobhub_stars") || "[]"); if (Array.isArray(value)) savedStars = value; } catch {}
  const stars = new Set(savedStars);
  const memberIds = j => Array.isArray(j.member_ids) && j.member_ids.length ? j.member_ids : [j.id];
  const isSaved = j => memberIds(j).some(id => stars.has(id));
  const stages = ["관심", "지원 완료", "서류 전형", "면접", "종료"];
  let progress = Object.create(null);
  try { const parsed = JSON.parse(store.get("jobhub_progress") || "{}"); if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) progress = Object.fromEntries(Object.entries(parsed).filter(([id,value]) => stages.includes(value))); } catch {}
  const stageOf = j => memberIds(j).map(id => Object.hasOwn(progress,id) ? progress[id] : null).find(stage => stages.includes(stage)) || "관심";
  function persistPersonal() {
    const saved = store.set("jobhub_stars", JSON.stringify([...stars]));
    const staged = store.set("jobhub_progress", JSON.stringify(progress));
    storageWarning = saved && staged ? "" : "저장 목록 변경을 이 브라우저에 저장하지 못했습니다. 변경은 현재 화면에서만 유지됩니다.";
    notice(storageWarning);
  }
  const safeUrl = (value) => { try { const url = new URL(value); return ["http:", "https:"].includes(url.protocol) ? url.href : "#"; } catch { return "#"; } };
  const isNew = (j) => { const stamp = j.first_seen || ""; const time = Date.parse(stamp.replace(" ", "T") + (/[Zz]|[+-]\d\d:\d\d$/.test(stamp) ? "" : "+09:00")); return time <= Date.now() && time > Date.now() - 2 * 86400000; };

  async function unlock(pw, remember) {
    try {
      DATA = await decrypt(pw);
    } catch { $("#err").textContent = "비밀번호가 맞지 않아요."; store.del("jobhub_pw"); return; }
    if (remember && !store.set("jobhub_pw", pw)) notice("비밀번호를 기억하지 못했습니다. 다음 방문에는 다시 입력해 주세요.");
    if (!remember) store.del("jobhub_pw");
    $("#pw").value = "";
    $("#lockbox").hidden = true; $("#app").hidden = false;
    $("#upd").textContent = "페이지 갱신 " + DATA.updated + " KST";
    const cats = {}; const groups = {}; const srcs = {};
    DATA.jobs.forEach((j) => {
      j.sources = (j.sources && j.sources.length) ? j.sources : [{ label: j.source_label, url: j.url }];
      j.srcLabels = j.sources.map((x) => x.label);
      if (j.active === 0 || (dday(j) != null && dday(j) < 0)) return;
      cats[j.category] = (cats[j.category] || 0) + 1;
      if (j.group_name) groups[j.group_name] = (groups[j.group_name] || 0) + 1;
      j.srcLabels.forEach((l) => { srcs[l] = (srcs[l] || 0) + 1; });
    });
    $("#category").innerHTML = '<option value="">직무 전체</option>' + Object.entries(cats).sort((a,b) => b[1]-a[1]).map(([c,n]) => `<option value="${esc(c)}">${esc(c)} (${n})</option>`).join("");
    $("#cats").innerHTML = `<button class="chip on" data-cat="" aria-pressed="true">모든 직무 <span class="n">${DATA.jobs.filter(j => j.active !== 0 && (dday(j) == null || dday(j) >= 0)).length}</span></button>` + Object.entries(cats).sort((a,b) => b[1]-a[1]).map(([c,n]) => `<button class="chip" data-cat="${esc(c)}" aria-pressed="false">${esc(c)} <span class="n">${n}</span></button>`).join("");
    $("#source").innerHTML += Object.entries(srcs).sort((a, b) => b[1] - a[1]).map(([g, n]) => `<option value="${esc(g)}">${esc(g)} (${n})</option>`).join("");
    $("#group").innerHTML += Object.entries(groups).sort((a, b) => b[1] - a[1]).map(([g, n]) => `<option value="${esc(g)}">${esc(g)} (${n})</option>`).join("");
    const statusLabels = {ok:"완료", partial:"일부 실패", error:"오류", paused:"일시 중지", skipped:"건너뜀", running:"진행 중", empty:"확인 완료·0건", robots_denied:"자동 접근 금지"};
    $("#healthRows").innerHTML = (DATA.collection || []).map(r => `<div class="health-row"><b>${esc(r.name)}</b><span>${esc(statusLabels[r.status] || r.status)} · 수집 ${esc(r.fetched)} · 신규 ${esc(r.new)} · ${esc(r.started || "")}<br>마지막 성공 ${esc(r.last_success || "기록 없음")} · 최근 7일 오류·중지 ${esc(r.recent_failures || 0)}회</span></div>`).join("") || '<p class="m">다음 수집 완료 후 상태가 표시됩니다.</p>';
    render();
    $("#q").focus();
  }

  function dday(j) {
    if (!j.deadline) return null;
    const today = new Intl.DateTimeFormat("en-CA", {timeZone:"Asia/Seoul", year:"numeric", month:"2-digit", day:"2-digit"}).formatToParts(new Date());
    const part = type => today.find(p => p.type === type).value;
    const value = (Date.parse(j.deadline + "T00:00:00+09:00") - Date.parse(`${part("year")}-${part("month")}-${part("day")}T00:00:00+09:00`)) / 86400000;
    return Number.isFinite(value) ? Math.round(value) : null;
  }

  function render() {
    const q = $("#q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const [lo, hi] = ($("#career").value || "-").split("-").map(Number);
    const grp = $("#group").value, src = $("#source").value, dl = Number($("#dl").value || 0), only = view === "saved", cat = $("#category").value;
    let rows = DATA.jobs.filter((j) => {
      if (!only && j.active === 0) return false;
      if (view === "new" && !isNew(j)) return false;
      if ($("#score").value && j.relevance < Number($("#score").value)) return false;
      if (dday(j) != null && dday(j) < 0 && !only) return false;
      if (cat && j.category !== cat) return false;
      if (grp && j.group_name !== grp) return false;
      if (src && !j.srcLabels.includes(src)) return false;
      if (only && !isSaved(j)) return false;
      if ($("#career").value && j.career_min != null && !(j.career_min <= hi && (j.career_max ?? 99) >= lo)) return false;
      const d = dday(j); if (dl && !(d != null && d >= 0 && d <= dl)) return false;
      const text = [j.title, j.company, j.category, (j.tags || []).join(" "), j.summary].join(" ").toLowerCase();
      return q.every((t) => text.includes(t));
    });
    const s = $("#sort").value;
    rows.sort((a, b) => s === "new" ? (b.first_seen || "").localeCompare(a.first_seen || "")
      : s === "dl" ? ((dday(a) ?? 999) - (dday(b) ?? 999)) : (b.relevance - a.relevance));
    const active = ["category","career","group","source","dl","score"].filter(id => $("#"+id).value);
    const extra = ["group","source","score"].filter(id => $("#"+id).value);
    $("#filterLabel").textContent = extra.length ? `추가 필터 · ${extra.length}개 적용` : "추가 필터";
    $("#savedTools").hidden = !only;
    $("#careerHint").hidden = !$("#career").value;
    $("#filterState").hidden = !active.length && !q.length;
    document.querySelectorAll("[data-cat]").forEach(x => {const selected = x.dataset.cat === cat; x.classList.toggle("on",selected); x.setAttribute("aria-pressed",String(selected));});
    $("#applied").hidden = !active.length && !q.length;
    $("#applied").textContent = [q.length ? `검색: ${$("#q").value.trim()}` : "", ...active.map(id => $("#"+id).selectedOptions[0].textContent)].filter(Boolean).join(" · ");
    $("#reset").hidden = !active.length && !q.length;
    document.querySelectorAll("[data-view]").forEach(x => { const selected = x.dataset.view === view; x.classList.toggle("on", selected); x.setAttribute("aria-pressed", String(selected)); });
    $("#count").textContent = `공고 ${rows.length}개${rows.length > visible ? ` · ${visible}개 표시` : ""}${view === "new" ? " · 최근 48시간에 처음 수집" : view === "saved" ? (storageWarning ? " · 현재 화면에서만 변경 유지" : " · 이 브라우저에 저장된 현재 공고") : ""}`;
    $("#more").hidden = rows.length <= visible;
    const expanded = new Set([...document.querySelectorAll(".job-details[open]")].map(x => x.dataset.job));
    $("#list").innerHTML = rows.slice(0, visible).map((j) => {
      const d = dday(j), fresh = isNew(j);
      const summary = String(j.summary || "").trim();
      const short = summary.split("\n").filter(Boolean)[0] || "";
      const excerpt = short.length > 160 ? short.slice(0,160) + "…" : short;
      const hasMore = summary !== short || short.length > 160;
      const ddTxt = j.active === 0 && (d == null || d >= 0) ? "현재 확인 불가" : d == null ? (j.deadline_text || "마감일 미확인") : d < 0 ? "마감" : d === 0 ? "오늘마감" : "D-" + d;
      return `<div class="card"><div class="body">
        <div class="co">${esc(j.company || "")}${fresh ? '<span class="new">새 공고</span>' : ""}</div>
        <a class="ttl" href="${esc(safeUrl(j.url))}" target="_blank" rel="noopener noreferrer">${esc(j.title)}</a>
        <div class="m">${[j.career_text, j.location, j.category].filter(Boolean).map(esc).join(" · ")}</div>
        ${excerpt ? `<p class="sum">${esc(excerpt)}</p>` : ''}
        ${hasMore ? `<details class="job-details" data-job="${esc(j.id)}" ${expanded.has(j.id) ? "open" : ""}><summary>요약 더 보기</summary><div class="sum">${esc(summary)}</div></details>` : ''}
        ${j.stale ? '<p class="filter-note">오래 미확인 · 지원 전 원문을 확인하세요.</p>' : ''}
        ${only ? `<details class="job-details" data-job="stage:${esc(j.id)}" ${expanded.has('stage:'+j.id) ? 'open' : ''}><summary>지원 관리 · ${esc(stageOf(j))}</summary><label class="field">지원 상태<select class="stage" data-id="${esc(j.id)}">${stages.map(stage => `<option ${stageOf(j) === stage ? 'selected' : ''}>${stage}</option>`).join('')}</select></label></details>` : ''}
        <div class="srcs">${j.sources.map(x => `<a href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener noreferrer">${esc(x.label)}</a>`).join("")}<span title="관심 직무와의 일치 정도이며 합격 가능성이 아닙니다">직무 적합도 ${esc(j.relevance)}점 · 참고용</span></div>
      </div><div class="side"><span class="dd ${d != null && d <= 3 && d >= 0 ? "hot" : ""}">${esc(ddTxt)}</span>
        <button class="star ${isSaved(j) ? "on" : ""}" data-id="${esc(j.id)}" aria-pressed="${isSaved(j)}" aria-label="${esc(j.title)} ${isSaved(j) ? "저장 해제" : "저장"}">${isSaved(j) ? "★" : "☆"}</button>
</div></div>`;
    }).join("") || `<div class="empty">${only ? '저장된 공고 중 조건에 맞는 공고가 없어요.' : '조건에 맞는 공고가 없어요.'}${active.length || q.length ? '<br>위의 ‘조건 초기화’로 조건을 해제해 보세요.' : ''}</div>`;
  }

  document.addEventListener("click", (e) => {
    const categoryButton = e.target.closest("[data-cat]");
    if (categoryButton) {$("#category").value = categoryButton.dataset.cat; visible = 40; render();}
    const st = e.target.closest(".star");
    if (st) {
      const id = st.dataset.id, job = DATA.jobs.find(j => j.id === id);
      const wasSaved = isSaved(job);
      memberIds(job).forEach(member => wasSaved ? stars.delete(member) : stars.add(member));
      persistPersonal();
      if (view === "saved") {
        const buttons = [...document.querySelectorAll(".star")], index = buttons.indexOf(st);
        render(); const next = [...document.querySelectorAll(".star")]; (next[Math.min(index,next.length-1)] || $("#count")).focus();
      } else {
        st.classList.toggle("on", isSaved(job)); st.setAttribute("aria-pressed", String(isSaved(job)));
        st.setAttribute("aria-label", `${job.title} ${isSaved(job) ? "저장 해제" : "저장"}`); st.textContent = isSaved(job) ? "★" : "☆";
      }
    }
  });
  document.addEventListener("change", e => {
    if (!e.target.matches(".stage")) return;
    const j = DATA.jobs.find(j => j.id === e.target.dataset.id);
    memberIds(j).forEach(id => Object.defineProperty(progress,id,{value:e.target.value,writable:true,enumerable:true,configurable:true}));
    e.target.closest("details").querySelector("summary").textContent = "지원 관리 · " + e.target.value;
    persistPersonal();
  });
  $("#backup").addEventListener("click", () => {
    const url = URL.createObjectURL(new Blob([JSON.stringify({version:1,stars:[...stars],progress},null,2)],{type:"application/json"}));
    const a = document.createElement("a"); a.href = url; a.download = "jobhub-backup.json"; a.click(); setTimeout(() => URL.revokeObjectURL(url),1000);
  });
  $("#restore").addEventListener("change", async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      if (file.size > 2000000) throw new Error();
      const data = JSON.parse(await file.text());
      if (data.version !== 1 || !Array.isArray(data.stars) || !data.stars.every(id => typeof id === "string" && id.length < 500) || !data.progress || typeof data.progress !== "object" || Array.isArray(data.progress) || !Object.entries(data.progress).every(([id, stage]) => id.length < 500 && stages.includes(stage))) throw new Error();
      data.stars.forEach(id => stars.add(id)); progress = Object.fromEntries([...Object.entries(progress), ...Object.entries(data.progress)]);
      persistPersonal(); render(); if (!storageWarning) notice("백업을 기존 저장 목록에 추가했습니다.");
    } catch { notice("백업 형식이 올바르지 않습니다. 기존 목록은 변경하지 않았습니다."); }
    e.target.value = "";
  });
  $("#more").addEventListener("click", () => { const first = visible; visible += 40; render(); (document.querySelectorAll(".ttl")[first] || $("#count")).focus(); });
  $("#quick").addEventListener("click", e => { const b = e.target.closest("[data-view]"); if (!b) return; view = b.dataset.view; visible = 40; render(); });
  $("#reset").addEventListener("click", () => { visible = 40; ["q","category","career","group","source","dl","score"].forEach(id => $("#"+id).value = ""); render(); $("#q").focus(); });
  ["q","category","career","group","source","dl","score","sort"].forEach(id => $("#"+id).addEventListener(id === "q" ? "input" : "change", () => { visible = 40; if (DATA) render(); }));
  $("#open").addEventListener("click", () => unlock($("#pw").value, $("#remember").checked));
  $("#pw").addEventListener("keydown", (e) => { if (e.key === "Enter") unlock($("#pw").value, $("#remember").checked); });
  const saved = store.get("jobhub_pw"); if (saved) unlock(saved, true);
})();
</script>
</body>
</html>
